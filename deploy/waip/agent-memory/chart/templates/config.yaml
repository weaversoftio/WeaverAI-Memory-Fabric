apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "am.core" . }}-config
  labels: {{- include "am.labels" . | nindent 4 }}
data:
  # llm.apiKey comes from env WAMF_LLM_API_KEY (Secret), which overrides the file.
  wamf-gateway.yaml: |
    deployMode: standalone
    stateBackend: local
    server:
      port: 8420
      host: 0.0.0.0
    data:
      baseDir: /data/wamf-memory
    llm:
      baseUrl: {{ .Values.llm.baseUrl | quote }}
      model: {{ .Values.llm.model | quote }}
      maxTokens: 32000
      timeoutMs: 300000
    memory:
      promptMode: {{ .Values.memory.promptMode }}
      capture: { enabled: true }
      extraction:
        enabled: true
        enableDedup: true
        maxMemoriesPerSession: 20
      persona:
        triggerEveryN: 50
        maxScenes: 15
      pipeline:
        everyNConversations: 5
        enableWarmup: true
        l1IdleTimeoutSeconds: 600
        l2DelayAfterL1Seconds: 90
        l2MinIntervalSeconds: 900
        l2MaxIntervalSeconds: 3600
      recall:
        enabled: true
        maxResults: 5
        scoreThreshold: 0.3
        strategy: hybrid
        timeoutMs: 5000
      storeBackend: sqlite
      embedding:
        provider: none
    skill:
      enabled: true
      routing:
        mode: bm25
        searchTopK: 20
      extraction:
        enabled: true
        maxIterations: 16
        queue:
          backend: local
          keyPrefix: wamf
          resultTtlSeconds: 86400
          lockTtlMs: 600000
          maxRetries: 2
          retryBackoffsMs: [5000, 15000]
      resources:
        maxResourceSizeBytes: 5000000
---
{{- /* Proxy admin key: generated once, then kept across upgrades (an empty key leaves
       /v3/admin/* and /v3/instance/proxy-destroy open on the public proxy route). */}}
{{- $proxyAdminKey := randAlphaNum 40 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name) }}
{{- if and $existing $existing.data (hasKey $existing.data "proxy-admin-key") }}
{{- $proxyAdminKey = index $existing.data "proxy-admin-key" | b64dec }}
{{- end }}
{{- /* Knowledge service key, same pattern: without it every Knowledge /v3 write route
       (LLM binding, wiki/code-graph create and delete) is open to any pod. */}}
{{- $knowledgeKey := randAlphaNum 40 }}
{{- if and $existing $existing.data (hasKey $existing.data "knowledge-service-key") }}
{{- $knowledgeKey = index $existing.data "knowledge-service-key" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "am.labels" . | nindent 4 }}
type: Opaque
stringData:
  llm-api-key: {{ .Values.llm.apiKey | quote }}
  git-auth-token: {{ .Values.gitAuth.token | default "" | quote }}
  proxy-admin-key: {{ $proxyAdminKey | quote }}
  knowledge-service-key: {{ $knowledgeKey | quote }}
  # Hub: mounting this file makes start-combined.sh skip writing it into the
  # (read-only, root-owned) image. The panel requires a non-empty api_key; core's
  # Bearer gate is off, so the value is a placeholder and is not checked.
  metadata-instances.json: |
    {
      "instances": [{
        "id": "default",
        "name": "default",
        "gateway_endpoint": "{{ include "am.coreUrl" . }}",
        {{- with .Values.publicUrls.proxy }}
        "proxy_endpoint": "{{ . }}",
        {{- end }}
        "api_key": "local"
      }]
    }
  # Proxy reads upstream credentials only from YAML, so the whole file is a Secret.
  proxy-config.yaml: |
    server:
      host: 0.0.0.0
      port: 8096
      forwardTimeoutMs: 600000
    upstream:
      url: {{ .Values.llm.baseUrl | quote }}
      apiKey: {{ .Values.llm.apiKey | quote }}
    log:
      file: ""
      level: info
      backend: console
    admin:
      apiKey: {{ $proxyAdminKey | quote }}
    # Upstream's billing reporter defaults to http://gateway.example.com:8000; empty = off.
    creditReport:
      url: ""
    wamf:
      enabled: true
      endpoint: "{{ include "am.coreUrl" . }}"
      apiKey: ""
      serviceId: default
      memory:
        enabled: true
        inject: true
        writeL0: true
        recallL1: true
        injectL2L3: true
    skill:
      endpoint: "{{ include "am.coreUrl" . }}"
      # Core's /v3/skill/* routes reject a missing or empty Bearer; with its gate
      # off the value is not checked, so a placeholder is enough.
      serviceToken: "local"
    # Required for <knowledge_tools> / Wiki injection. injectors lists "knowledge"
    # but the injector only registers when knowledge.enabled + serviceToken are set.
    knowledge:
      enabled: true
      endpoint: "{{ include "am.coreUrl" . }}"
      serviceToken: "local"
      serviceId: "default"
    auth:
      enabled: true
      url: "{{ include "am.coreUrl" . }}"
      timeoutMs: 5000
    sessionInit:
      enabled: true
      maxRetries: 3
      injectAgentContext: true
      injectTaskContext: true
      headerAutoSelect:
        enabled: true
        teamHeader: "x-team-id"
        agentHeader: "x-agent-id"
        taskHeader: "x-task-id"
        onMismatch: "form"
    costGuard:
      enabled: false
    injection:
      enabled: true
      injectors:
        - skill
        - knowledge
        - wamf-memory
    redis:
      enabled: false
