# ============================================================
# WAMF Gateway: Standalone single-machine configuration
# ============================================================
# Fits: local development / Hermes sidecar / single Agent on a single machine
# Characteristics: no outside dependencies (no Redis), in-process state management
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"

data:
  baseDir: "~/.weaverai-memory-fabric/memory-wamf"

# ── LLM (required) ──
llm:
  baseUrl: "https://api.openai.com/v1"
  apiKey: "${WAMF_LLM_API_KEY}"    # injected from an environment variable
  model: "gpt-4o"
  maxTokens: 4096
  timeoutMs: 120000

# ── Memory engine configuration ──
memory:

  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000

  # ── Storage backend ──
  # sqlite:  local SQLite (default, zero config)
  # mongodb: MongoDB (connection from MONGODB_ENDPOINT / MONGODB_DATABASE env)
  storeBackend: "sqlite"

  embedding:
    provider: "none"               # vector search off by default, BM25 only
    # Example enabling vector search:
    # provider: "openai"
    # baseUrl: "https://api.openai.com/v1"
    # apiKey: "${WAMF_LLM_API_KEY}"
    # model: "text-embedding-3-small"
    # dimensions: 1536

# ── Skill module (optional, off by default) ──
# Skill adds an extra capability and doesn't affect the Memory engine above.
# When enabled, skill data lives under {baseDir}/skills/.
# It can also be enabled with the environment variable WAMF_SKILL_ENABLED=true.
# skill:
#   enabled: true
#   routing:
#     mode: "bm25"
#     searchTopK: 20        # maximum number of skills the listing endpoint injects (name+description)
#   extraction:
#     enabled: true         # needs a valid llm config
#     maxIterations: 16
#   resources:
#     maxResourceSizeBytes: 5000000
#     allowExecutable: false